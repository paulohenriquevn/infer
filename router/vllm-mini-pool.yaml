# Decode replica of the glm5next mini model behind the `optimized-baseline` InferencePool (llm-d v1.0.0).
# The arguments come from an earlier single-GPU validation run (f1/resultados-colab-g4-sucesso, not in this
# repository), with --gpu-memory-utilization 0.5 (0.85 hit OOM during vLLM warmup on this GPU).
# The make-mini ConfigMap must hold make_mini.py, the script that builds the reduced model from the
# GLM-5.3-Flash config; it is not in this repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
  labels: {app: vllm-mini, project: infer-validation}
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm-mini}
  template:
    metadata:
      labels:
        app: vllm-mini
        llm-d.ai/guide: optimized-baseline
        llm-d.ai/model: glm5next-mini
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.32.0
          command: ["bash", "-ec"]
          args:
            - |
              mkdir -p /work/ref && cd /work
              REV=46a050bec13002ad29ee795c16e61cf4fa3c4a9c
              BASE=https://huggingface.co/zai-org/GLM-5.3-Flash/resolve/$REV
              curl -sfL $BASE/config.json -o ref/config.json
              cp /scripts/make_mini.py .
              python3 make_mini.py --out mini
              for f in tokenizer.json tokenizer_config.json chat_template.jinja generation_config.json processor_config.json LICENSE; do
                curl -sfL $BASE/$f -o mini/$f
              done
              vllm download-kernels || true
              exec vllm serve mini --served-model-name mini --host 0.0.0.0 --port 8000 \
                --max-model-len 262144 --dtype bfloat16 --kv-cache-dtype fp8_ds_mla \
                --gpu-memory-utilization 0.5 $VLLM_EXTRA
          env:
            # Enables /reset_prefix_cache to clear the cache between A/B rounds. Only inside the cluster.
            - {name: VLLM_SERVER_DEV_MODE, value: "1"}
            # Extra vllm serve arguments (e.g. --kv-cache-memory-bytes ...), changed with kubectl set env.
            - {name: VLLM_EXTRA, value: ""}
          ports:
            - {containerPort: 8000, name: http}
          resources:
            limits: {nvidia.com/gpu: 1}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: work, mountPath: /work}
            - {name: shm, mountPath: /dev/shm}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90
      volumes:
        - name: scripts
          configMap: {name: make-mini}
        - name: work
          emptyDir: {}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
